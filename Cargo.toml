[package]
name = "redbookmaster"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for creating Red Book compatible CD masters"
authors = ["Mathias Karstaedt"]
license = "MIT"
repository = "https://github.com/webmatze/redbookmaster"
keywords = ["audio", "cd", "mastering", "redbook", "cue"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
hound = "3.5"
rodio = "0.19"
rubato = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
regex = "1"

[target.'cfg(unix)'.dependencies]
termios = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
