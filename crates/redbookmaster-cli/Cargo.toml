[package]
name = "redbookmaster"
version = "0.1.0"
edition = "2021"
description = "A CLI tool for creating Red Book compatible CD masters"
authors = ["Mathias Karstaedt"]
license = "MIT"
repository = "https://github.com/webmatze/redbookmaster"
keywords = ["audio", "cd", "mastering", "redbook", "cue"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "redbookmaster"
path = "src/main.rs"

[dependencies]
redbookmaster-lib = { path = "../redbookmaster-lib" }
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
colored = "2"
rfd = "0.15"
indicatif = "0.17"
regex = "1"

[target.'cfg(unix)'.dependencies]
termios = "0.3"
